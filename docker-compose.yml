# Pinned so the containers/volume keep the same names no matter what the
# project folder is called (the folder name is the default otherwise).
name: project

services:
  db:
    image: postgres:16-alpine
    container_name: niche_events_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      # Loopback only: the backend runs on this PC, so nothing else on the
      # network should be able to reach Postgres.
      - "127.0.0.1:5432:5432"
    volumes:
      # Own volume: the older "project_db_data" volume holds a database from a
      # different schema branch (missing connections/email_otps/join_requests),
      # so this copy starts clean. The old volume is left untouched.
      - college_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  college_db_data:
